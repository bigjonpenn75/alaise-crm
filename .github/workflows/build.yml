name: Build

# Installs Composer dependencies on PHP 8.5, builds the front-end assets,
# runs the test suite, and publishes build outputs:
#   - composer.lock and public/build are committed back to main
#   - vendor/ is published as a tarball on the orphan branch `vendor-build`
#     so it can be fetched over git without access to Packagist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo, pdo_mysql, pdo_sqlite, openssl, tokenizer, xml, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run tests
        run: php artisan test --without-tty

      - name: Commit lock file and built assets back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f composer.lock public/build
          if ! git diff --cached --quiet; then
            git commit -m "ci: update composer.lock and built assets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish vendor tarball to vendor-build branch
        run: |
          tar -czf /tmp/vendor.tar.gz vendor
          cp composer.lock /tmp/composer.lock
          rm -rf /tmp/vb && mkdir /tmp/vb && cd /tmp/vb
          git init -q -b vendor-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/vendor.tar.gz /tmp/composer.lock .
          echo "Built from ${GITHUB_SHA} with PHP $(php -r 'echo PHP_VERSION;')" > BUILD.txt
          git add .
          git commit -q -m "vendor build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" vendor-build
